name: Deploy beta to Cloudflare

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-whois-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out beta
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the repository secret CLOUDFLARE_API_TOKEN to enable beta deployment.'
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Check code and query regressions
        run: |
          npm run lint:all
          npm test

      - name: Build for Cloudflare Workers
        run: npm run build:beta

      - name: Check TypeScript
        run: npm run typecheck

      - name: Deploy whois-beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:beta
